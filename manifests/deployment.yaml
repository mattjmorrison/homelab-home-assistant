apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: init-config
          image: busybox
          command: ['sh', '-c', '[ -f /config/configuration.yaml ] || cp /tmp/initial-config/configuration.yaml /config/configuration.yaml']
          volumeMounts:
            - name: config
              mountPath: /config
            - name: initial-config
              mountPath: /tmp/initial-config
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:stable
          ports:
            - containerPort: 8123
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: initial-config
          configMap:
            name: home-assistant-initial-config
